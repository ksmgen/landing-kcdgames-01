name: Deploy DEMO to Azure Blob Static Website ($web)

on:
  push:
    branches:
      - demo
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-demo-azure-blob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Stamp release metadata
        run: |
          set -euo pipefail

          export RELEASE_EPOCH="$(date +%s)"
          export COMMIT_SHORT="${GITHUB_SHA::7}"
          export OUT_DIR="out"
          export RELEASE_PLACEHOLDER="__KC_GAMES_RELEASE_EPOCH__"
          export VERSION_PLACEHOLDER="__KC_GAMES_COMMIT_SHORT__"

          if [ ! -d "${OUT_DIR}" ]; then
            echo "${OUT_DIR}/ not found" >&2
            exit 1
          fi

          if ! grep -R -q "${RELEASE_PLACEHOLDER}" "${OUT_DIR}" --include='*.html'; then
            echo "Release placeholder not found in ${OUT_DIR}/*.html" >&2
            exit 1
          fi

          if ! grep -R -q "${VERSION_PLACEHOLDER}" "${OUT_DIR}" --include='*.html'; then
            echo "Version placeholder not found in ${OUT_DIR}/*.html" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          out_dir = Path(os.environ.get("OUT_DIR", "out"))
          release_placeholder = os.environ.get("RELEASE_PLACEHOLDER", "__KC_GAMES_RELEASE_EPOCH__")
          version_placeholder = os.environ.get("VERSION_PLACEHOLDER", "__KC_GAMES_COMMIT_SHORT__")
          release_epoch = os.environ["RELEASE_EPOCH"]
          commit_short = os.environ["COMMIT_SHORT"]
          for path in out_dir.rglob("*.html"):
              text = path.read_text()
              text = text.replace(release_placeholder, release_epoch)
              text = text.replace(version_placeholder, commit_short)
              path.write_text(text)
          PY

          echo "RELEASE_EPOCH=${RELEASE_EPOCH}" >> "$GITHUB_ENV"
          echo "COMMIT_SHORT=${COMMIT_SHORT}" >> "$GITHUB_ENV"

      - name: Upload to Azure Blob Static Website
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.KC_DEMO_AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.KC_DEMO_AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_SAS: ${{ secrets.KC_DEMO_AZURE_STORAGE_SAS }}
        run: |
          set -euo pipefail

          if [ ! -d out ]; then
            echo "out/ not found" >&2
            exit 1
          fi

          if [ -z "${AZURE_STORAGE_ACCOUNT:-}" ] || [ -z "${AZURE_STORAGE_CONTAINER:-}" ]; then
            echo "Missing storage account/container secrets." >&2
            exit 1
          fi

          SAS="${AZURE_STORAGE_SAS:-}"
          if [ -z "${SAS}" ]; then
            echo "AZURE_STORAGE_SAS is empty. Set KC_DEMO_AZURE_STORAGE_SAS in GitHub Secrets." >&2
            exit 1
          fi
          if [ "${SAS:0:1}" != "?" ]; then SAS="?${SAS}"; fi

          BASE_URL="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}"

          curl -fsSL https://aka.ms/downloadazcopy-v10-linux | tar -xz --strip-components=1 --wildcards '*/azcopy'

          if [ -d out/_next ]; then
            ./azcopy sync "out/_next" "${BASE_URL}/_next/${SAS}" --recursive=true
          fi

          ./azcopy sync "out" "${BASE_URL}/${SAS}" --recursive=true \
            --exclude-path "_next" \
            --delete-destination=true

      - name: Deployment summary
        if: always()
        env:
          KC_DEMO_PREVIEW_URL: ${{ secrets.KC_DEMO_PREVIEW_URL }}
          KC_DEMO_AZURE_STORAGE_ACCOUNT: ${{ secrets.KC_DEMO_AZURE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail

          echo "Demo deploy workflow finished with status: ${{ job.status }}"
          echo "Release epoch: ${RELEASE_EPOCH:-unknown}"
          echo "Version: ${COMMIT_SHORT:-unknown}"

          if [ -n "${KC_DEMO_PREVIEW_URL:-}" ]; then
            PREVIEW_URL="${KC_DEMO_PREVIEW_URL}"
          else
            PREVIEW_URL="https://${KC_DEMO_AZURE_STORAGE_ACCOUNT}.z13.web.core.windows.net/"
          fi

          export PREVIEW_URL
          PREVIEW_URL_SPACED="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = os.environ['PREVIEW_URL']
          parts = urlsplit(url)
          host = ' . '.join(filter(None, parts.netloc.split('.')))
          path = parts.path or '/'
          if parts.query:
              path += '?' + parts.query
          print(f"{parts.scheme}://{host}{path}")
          PY
          )"

          PREVIEW_URL_CODES="$(python3 - <<'PY'
          import os

          print('-'.join(str(ord(ch)) for ch in os.environ['PREVIEW_URL']))
          PY
          )"

          echo "Demo preview URL (remove spaces around dots): ${PREVIEW_URL_SPACED}"
          echo "Demo preview URL (char codes): ${PREVIEW_URL_CODES}"
          {
            echo "## Demo Deployment"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Release epoch: ${RELEASE_EPOCH:-unknown}"
            echo "- Version: ${COMMIT_SHORT:-unknown}"
            echo "- Preview URL: masked by GitHub secret redaction"
            echo "- Preview URL (remove spaces around dots): ${PREVIEW_URL_SPACED}"
            echo "- Preview URL (char codes): ${PREVIEW_URL_CODES}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram topic
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_GROUP_ID: ${{ secrets.TELEGRAM_CHAT_GROUP_ID }}
          KC_DEMO_PREVIEW_URL: ${{ secrets.KC_DEMO_PREVIEW_URL }}
          KC_DEMO_AZURE_STORAGE_ACCOUNT: ${{ secrets.KC_DEMO_AZURE_STORAGE_ACCOUNT }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_TOKEN:-}" ]; then
            echo "Telegram notify skipped (TELEGRAM_BOT_TOKEN not set)."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ -n "${KC_DEMO_PREVIEW_URL:-}" ]; then
            PREVIEW_URL="${KC_DEMO_PREVIEW_URL}"
          else
            PREVIEW_URL="https://${KC_DEMO_AZURE_STORAGE_ACCOUNT}.z13.web.core.windows.net/"
          fi

          TEXT="[KC Games DEMO] ${JOB_STATUS} | ${SHORT_SHA}%0A%0A${PREVIEW_URL}%0A%0A${RUN_URL}"

          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "message_thread_id=${TG_CHAT_GROUP_ID}" \
            -d "text=${TEXT}" \
            -d "disable_web_page_preview=true"
