name: Deploy DEMO to Azure Blob Static Website ($web)

on:
  push:
    branches:
      - demo
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-demo-azure-blob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload to Azure Blob Static Website
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.KC_DEMO_AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.KC_DEMO_AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_SAS: ${{ secrets.KC_DEMO_AZURE_STORAGE_SAS }}
        run: |
          set -euo pipefail

          if [ ! -d out ]; then
            echo "out/ not found" >&2
            exit 1
          fi

          if [ -z "${AZURE_STORAGE_ACCOUNT:-}" ] || [ -z "${AZURE_STORAGE_CONTAINER:-}" ]; then
            echo "Missing storage account/container secrets." >&2
            exit 1
          fi

          SAS="${AZURE_STORAGE_SAS:-}"
          if [ -z "${SAS}" ]; then
            echo "AZURE_STORAGE_SAS is empty. Set KC_DEMO_AZURE_STORAGE_SAS in GitHub Secrets." >&2
            exit 1
          fi
          if [ "${SAS:0:1}" != "?" ]; then SAS="?${SAS}"; fi

          BASE_URL="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}"

          curl -fsSL https://aka.ms/downloadazcopy-v10-linux | tar -xz --strip-components=1 --wildcards '*/azcopy'

          if [ -d out/_next ]; then
            ./azcopy sync "out/_next" "${BASE_URL}/_next/${SAS}" --recursive=true
          fi

          ./azcopy sync "out" "${BASE_URL}/${SAS}" --recursive=true \
            --exclude-path "_next" \
            --delete-destination=true

      - name: Deployment summary
        if: always()
        run: |
          echo "Demo deploy workflow finished with status: ${{ job.status }}"

      - name: Notify Discord thread
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_THREAD_ID: '1499909495969550499'
          KC_DEMO_PREVIEW_URL: ${{ secrets.KC_DEMO_PREVIEW_URL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ]; then
            echo "Discord notify skipped (DISCORD_BOT_TOKEN not set)."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ -n "${KC_DEMO_PREVIEW_URL:-}" ]; then
            PREVIEW_URL="${KC_DEMO_PREVIEW_URL}"
          else
            PREVIEW_URL="preview URL not configured"
          fi

          export SHORT_SHA RUN_URL PREVIEW_URL

          python3 - <<'PY'
          import json
          import os

          content = "\n".join([
              f"[kc-games demo deploy] {os.environ['JOB_STATUS']} | {os.environ['SHORT_SHA']}",
              f"branch: {os.environ['GITHUB_REF_NAME']}",
              f"actor: {os.environ['GITHUB_ACTOR']}",
              f"preview: {os.environ['PREVIEW_URL']}",
              f"run: {os.environ['RUN_URL']}",
          ])

          with open('payload.json', 'w', encoding='utf-8') as f:
              json.dump({"content": content}, f)
          PY

          curl -sS -X POST "https://discord.com/api/v10/channels/${DISCORD_THREAD_ID}/messages" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @payload.json
